name: Deploy CosmoStellarAtlas to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Project Dependencies
        run: npm ci

      - name: Validate TypeScript Compilation
        run: npm run lint

      - name: Execute Vitest Automated Test Suite
        run: npm test

      - name: Execute Python Analytical Utilities Test Suite
        run: npm run test:python

      - name: Verify Dataset Integrity & Provenance
        run: npm run data:validate

      - name: Build Optimized Production Bundle
        run: npm run build

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Deploy Static Site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

